name: Capture Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run capture script
        run: node tools/capture-data.js

      - name: Commit and push captured data
        run: |
          git config user.name 'Bitcoin Sahi Bot'
          git config user.email 'bot@bitcoinsahi.com'
          git add captured-data/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "data: auto-capture $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
