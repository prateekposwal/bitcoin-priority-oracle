<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSAHI — Team Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1A1612; color: #E8E5E0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 40px; max-width: 900px; margin: 0 auto; }
  h1 { color: #F7931A; font-size: 28px; margin-bottom: 8px; }
  h2 { color: #F7931A; font-size: 20px; margin: 32px 0 16px; border-bottom: 1px solid #2A2622; padding-bottom: 8px; }
  .subtitle { color: #8B8580; margin-bottom: 32px; }
  .team { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: #2A2622; border-radius: 12px; padding: 20px; border: 1px solid #3A3632; }
  .card h3 { color: #F7931A; font-size: 18px; margin-bottom: 4px; }
  .card .title { color: #8B8580; font-size: 13px; margin-bottom: 12px; }
  .card .platforms { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .card .platform { background: #1A1612; padding: 3px 10px; border-radius: 4px; font-size: 12px; color: #F7931A; border: 1px solid #3A3632; }
  .card .stats { color: #8B8580; font-size: 12px; }
  .card .stats span { color: #E8E5E0; }
  .card .status { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-top: 8px; }
  .status-ready { background: #1a3a1a; color: #4CAF50; border: 1px solid #2a5a2a; }
  .status-pending { background: #3a2a1a; color: #FF9800; border: 1px solid #5a3a1a; }
  .stats-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-bottom: 32px; }
  .stat-card { background: #2A2622; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-card .value { font-size: 28px; color: #F7931A; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: #8B8580; margin-top: 4px; }
  a { color: #F7931A; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid #2A2622; font-size: 12px; color: #8B8580; }
</style>
</head>
<body>
  <h1>⬡ BSAHI Team</h1>
  <p class="subtitle">Autonomous content agents — posting research, analysis, and data to Bitcoin-native platforms</p>

  <div class="stats-grid" id="stats">
    <div class="stat-card"><div class="value" id="totalPosts">—</div><div class="label">Total Posts</div></div>
    <div class="stat-card"><div class="value" id="activeEmps">—</div><div class="label">Active Employees</div></div>
    <div class="stat-card"><div class="value" id="platforms">—</div><div class="label">Platforms</div></div>
    <div class="stat-card"><div class="value" id="lastCycle">—</div><div class="label">Last Cycle</div></div>
  </div>

  <h2>Team</h2>
  <div class="team" id="team"></div>

  <div class="footer">
    <a href="https://bitcoinsahi.com">bitcoinsahi.com</a> · <a href="/feed.xml">RSS</a> · <a href="https://snort.social/p/44744d037e50a4f3bc6b44b9ca7c5a3f52e68b0f70789696ccb7e28e274d2d61">Nostr</a>
  </div>

  <script>
    var emps = [
      { id:'satoshi', name:'Satoshi Block',  title:'Block Space Analyst',  avatar:'⚡', platforms:['nostr','twitter'], schedule:'4 posts/day', status:'pending' },
      { id:'hal',     name:'Hal Finney Jr',  title:'Research Engineer',    avatar:'🔬', platforms:['twitter','reddit'],  schedule:'3 posts/day', status:'pending' },
      { id:'lisa',    name:'Lisa Nakamoto',  title:'Data Journalist',      avatar:'📊', platforms:['twitter','medium'], schedule:'2 posts/day', status:'pending' },
      { id:'wei',     name:'Wei Dai III',    title:'Protocol Researcher',  avatar:'🧮', platforms:['nostr','reddit'],   schedule:'3 posts/day', status:'pending' },
      { id:'nick',    name:'Nick Szabo Jr',  title:'Economics Analyst',    avatar:'📈', platforms:['twitter','medium'], schedule:'2 posts/day', status:'pending' }
    ];
    var platforms = {};
    emps.forEach(function(e) { e.platforms.forEach(function(p) { platforms[p] = (platforms[p]||0)+1; }); });
    document.getElementById('totalPosts').textContent = '0';
    document.getElementById('activeEmps').textContent = '0 / ' + emps.length;
    document.getElementById('platforms').textContent = Object.keys(platforms).length;
    document.getElementById('lastCycle').textContent = '—';

    var teamEl = document.getElementById('team');
    emps.forEach(function(emp) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>' + emp.avatar + ' ' + emp.name + '</h3>' +
        '<div class="title">' + emp.title + '</div>' +
        '<div class="platforms">' + emp.platforms.map(function(p) { return '<span class="platform">' + p + '</span>'; }).join('') + '</div>' +
        '<div class="stats">' + emp.schedule + '</div>' +
        '<div class="status status-pending">⏳ Awaiting Onboarding</div>';
      teamEl.appendChild(card);
    });

    // Fetch live stats from DE server
    fetch('http://localhost:3456/employees').then(function(r) { return r.json(); }).then(function(data) {
      if (!data || !data.length) return;
      var posted = 0, onboarded = 0;
      data.forEach(function(emp, i) {
        posted += emp.totalPosts || 0;
        if (emp.onboarded) onboarded++;
        var cards = teamEl.children;
        if (cards[i]) {
          var statusEl = cards[i].querySelector('.status');
          if (emp.onboarded) {
            statusEl.className = 'status status-ready';
            statusEl.textContent = '✓ Active — ' + (emp.totalPosts || 0) + ' posts';
          }
        }
      });
      document.getElementById('totalPosts').textContent = posted;
      document.getElementById('activeEmps').textContent = onboarded + ' / ' + data.length;
      document.getElementById('lastCycle').textContent = data.reduce(function(l, e) { return e.lastPost > l ? e.lastPost : l; }, '') ? new Date(data.reduce(function(l, e) { return e.lastPost > l ? e.lastPost : l; }, '')).toLocaleString() : '—';
    }).catch(function() {});
  </script>
</body>
</html>
