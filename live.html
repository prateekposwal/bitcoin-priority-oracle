<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Dashboard — Bitcoin Sahi Research</title>
<script>if(window.location.hostname.includes("vercel.app")){window.location.replace("https://bitcoinsahi.com"+window.location.pathname)}</script>
<style>
  :root { --orange: #F7931A; --bg: #0A0A0F; --surface: #161B22; --border: #30363D; --text: #F0F6FC; --muted: #8B949E; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.5; }
  a { color: var(--orange); text-decoration: none; }

  nav { display: flex; align-items: center; gap: 24px; padding: 14px 32px; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
  nav .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
  nav .brand span { color: var(--orange); }
  nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
  nav a:hover { color: var(--text); }
  nav .spacer { flex: 1; }
  nav .cta { background: var(--orange); color: #000; font-weight: 700; padding: 8px 18px; border-radius: 8px; font-size: 13px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
  .page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
  .page-sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; }

  /* ── KPI Cards ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
  .kpi-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 6px; }
  .kpi-card .value { font-size: 32px; font-weight: 800; margin: 2px 0; letter-spacing: -0.5px; }
  .kpi-card .sub { font-size: 12px; color: #555; }

  /* ── Section ── */
  .section { margin-bottom: 28px; }
  .section-header {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: var(--orange); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Stat row ── */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 18px; font-weight: 700; margin-top: 2px; }

  /* ── Fee bars ── */
  .fee-chart { display: flex; align-items: flex-end; gap: 6px; height: 60px; margin-top: 10px; padding: 8px 0; }
  .fee-chart .bar { flex: 1; border-radius: 3px 3px 0 0; min-width: 40px; transition: height 0.5s; position: relative; }
  .fee-chart .bar .bar-label { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); white-space: nowrap; }

  .history-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 8px; padding: 10px 0; }
  .history-chart .day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; }
  .history-chart .day .bar-fast { width: 100%; min-width: 10px; border-radius: 3px 3px 0 0; background: var(--orange); }
  .history-chart .day .bar-econ { width: 80%; min-width: 8px; border-radius: 3px 3px 0 0; background: #58A6FF; }
  .history-chart .day .date-label { font-size: 9px; color: #555; transform: rotate(-30deg); margin-top: 4px; white-space: nowrap; }

  .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chart-legend span::before { content: '■ '; }

  /* ── Alerts ── */
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 6px; background: var(--surface); border-left: 4px solid; }
  .alert.good { border-color: #3FB950; color: #3FB950; }
  .alert.warn { border-color: #D29922; color: #D29922; }
  .alert.error { border-color: #F85149; color: #F85149; }

  .footer { font-size: 12px; color: #555; text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }

  @media (max-width: 700px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    nav { padding: 10px 16px; gap: 12px; }
  }
</style>
</head>
<body>
<nav>
  <span class="brand">BITCOIN <span>SAHI</span></span>
  <a href="/">Home</a>
  <a href="/live">Dashboard</a>
  <a href="/articles">Articles</a>
  <span class="spacer"></span>
  <a href="https://reddit.com/r/BitcoinEngineering" class="cta">r/BitcoinEngineering</a>
</nav>

<div class="container">
  <div class="page-title">📊 Live Data Dashboard</div>
  <div class="page-sub">Real-time blockchain metrics from public APIs. Updated daily via GitHub Actions.</div>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="section">
    <div class="section-header">Mempool Fees (sat/vB)</div>
    <div class="stat-row" id="fee-row"></div>
    <div class="fee-chart" id="fee-bar"></div>
  </div>

  <div class="section">
    <div class="section-header">Fee Trend — Last 14 Days</div>
    <div class="history-chart" id="history-chart"></div>
    <div class="chart-legend"><span style="color:var(--orange)">Fastest fee</span><span style="color:#58A6FF">Economy fee</span></div>
    <div style="font-size:11px;color:#555;margin-top:4px;" id="history-dates"></div>
  </div>

  <div class="section">
    <div class="section-header">Model Output</div>
    <div class="stat-row" id="model-row"></div>
  </div>

  <div class="section">
    <div class="section-header">Market Context</div>
    <div class="stat-row" id="market-row"></div>
  </div>

  <div class="section">
    <div class="section-header">Alerts</div>
    <div id="alerts"></div>
  </div>

  <div class="footer" id="timestamp"></div>
</div>

<script>
fetch('tools/live_data.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => {
    var fees = d.fees || {};
    var btc = d.btc_price || 63000;
    var alerts = d.alerts || [];

    // ── KPI Cards ──
    var kpis = [
      { lbl: 'BTC Price', val: '$' + Number(btc).toLocaleString(), sub: 'Live from blockchain.info', clr: btc > 50000 ? '#3FB950' : '#F0F6FC' },
      { lbl: 'Fastest Fee', val: (fees.fastestFee || '—') + ' sat/vB', sub: 'Next block ~10 min', clr: fees.fastestFee > 50 ? '#F85149' : fees.fastestFee > 10 ? '#D29922' : '#3FB950' },
      { lbl: 'Economy Fee', val: (fees.economyFee || '—') + ' sat/vB', sub: 'Slow confirmation ~1hr+', clr: '#8B949E' },
      { lbl: 'Storage Cost', val: '$0.008', sub: 'Per inscription (10yr lifetime)', clr: '#F7931A' },
    ];
    document.getElementById('kpi-grid').innerHTML = kpis.map(k =>
      '<div class="kpi-card"><div class="label">' + k.lbl + '</div><div class="value" style="color:' + k.clr + '">' + k.val + '</div><div class="sub">' + k.sub + '</div></div>'
    ).join('');

    // ── Fee estimates ──
    var feeLabels = { fastestFee: 'Fastest', halfHourFee: '30 Min', hourFee: '1 Hour', economyFee: 'Economy', minimumFee: 'Minimum' };
    document.getElementById('fee-row').innerHTML = Object.entries(feeLabels).map(([k, lbl]) =>
      '<div class="stat-card"><div class="label">' + lbl + '</div><div class="value">' + (fees[k] || '—') + ' sat/vB</div></div>'
    ).join('');

    // ── Fee bar chart ──
    var barData = [fees.fastestFee || 0, fees.halfHourFee || 0, fees.hourFee || 0, fees.economyFee || 0, fees.minimumFee || 0];
    var maxFee = Math.max(1, ...barData);
    var barLabels = ['Fastest', '30 Min', '1 Hour', 'Economy', 'Minimum'];
    var barColors = ['#F7931A', '#D29922', '#3FB950', '#58A6FF', '#8B949E'];
    document.getElementById('fee-bar').innerHTML = barData.map((v, i) =>
      '<div class="bar" style="height:' + (v / maxFee * 100 * 0.85 + 15) + '%;background:' + barColors[i] + '" title="' + barLabels[i] + ': ' + v + ' sat/vB"><span class="bar-label">' + v + '</span></div>'
    ).join('');

    // ── Fee history trend ──
    fetch('tools/fee_history.json?_=' + Date.now())
      .then(r => r.json())
      .then(hist => {
        if (!hist || hist.length < 1) {
          document.getElementById('history-chart').innerHTML = '<div style="color:#555;font-size:14px;">Building history — will populate over the coming days</div>';
          return;
        }
        var fastest = hist.map(d => d.fastestFee || 0);
        var economy = hist.map(d => d.economyFee || 0);
        var maxH = Math.max(1, ...fastest);
        var html = '';
        for (var i = 0; i < hist.length; i++) {
          var fh = Math.max(4, fastest[i] / maxH * 100 * 0.8);
          var eh = Math.max(3, economy[i] / maxH * 100 * 0.7);
          html += '<div class="day">';
          html += '<div class="bar-fast" style="height:' + fh + '%;" title="Fastest: ' + fastest[i] + ' sat/vB (' + hist[i].date + ')"></div>';
          html += '<div class="bar-econ" style="height:' + eh + '%;" title="Economy: ' + economy[i] + ' sat/vB"></div>';
          html += '<div class="date-label">' + hist[i].date.slice(5) + '</div>';
          html += '</div>';
        }
        document.getElementById('history-chart').innerHTML = html;
        document.getElementById('history-dates').textContent = 'Showing ' + hist.length + ' days — ' + hist[0].date + ' to ' + hist[hist.length-1].date;
      })
      .catch(function() {});

    // ── Model output ──
    var nc = 924.35, bpi = 400, ipm = 100000;
    var cpb = nc / (bpi * ipm * 12);
    var s10 = cpb * bpi * 10;
    var ext = s10 * ipm * 12 / 10;
    document.getElementById('model-row').innerHTML = [
      { lbl: 'Node Cost / Year', val: '$' + nc.toFixed(0) },
      { lbl: 'Cost per Byte / Year', val: '$' + cpb.toFixed(10) },
      { lbl: 'Storage / Inscription (10yr)', val: '$' + s10.toFixed(4) },
      { lbl: 'Total Externality / Year', val: '$' + (ext / 1000).toFixed(1) + 'K' },
      { lbl: 'Fee ÷ Storage Ratio', val: ((0.06)/s10).toFixed(0) + '× – ' + ((25)/s10).toFixed(0) + '×' },
    ].map(m => '<div class="stat-card"><div class="label">' + m.lbl + '</div><div class="value">' + m.val + '</div></div>').join('');

    // ── Market context ──
    var spd = btc > 0 ? (100000000 / btc).toFixed(1) : '—';
    var ifs = (fees.economyFee || 1) * 100;
    var ifu = btc > 0 ? (ifs * btc / 100000000).toFixed(4) : '—';
    var utxos = d.utxo_set && d.utxo_set.utxo_count ? Number(d.utxo_set.utxo_count).toLocaleString() : '—';
    var bh = d.block_height || '—';
    var mt = d.mempool ? Number(d.mempool.unconfirmed_tx).toLocaleString() : '—';
    var bs = d.bip110_signaling;
    var bsVal = bs && bs.signaling_percent !== undefined ? bs.signaling_percent + '%' : (bs && bs.last_known ? bs.last_known : 'N/A');
    document.getElementById('market-row').innerHTML = [
      { lbl: 'Satoshis per USD', val: spd + ' sat' },
      { lbl: 'Inscription Fee (slow)', val: '$' + ifu },
      { lbl: 'Unconfirmed Tx', val: mt },
      { lbl: 'Block Height', val: bh },
      { lbl: 'BIP-110 Signaling', val: bsVal },
    ].map(m => '<div class="stat-card"><div class="label">' + m.lbl + '</div><div class="value">' + m.val + '</div></div>').join('');

    // ── Alerts ──
    var ah = '';
    if (alerts.length) alerts.forEach(a => { ah += '<div class="alert warn">⚠ ' + a + '</div>'; });
    if (fees.fastestFee > 100) ah += '<div class="alert error">🚨 High fees: ' + fees.fastestFee + ' sat/vB — possible inscription mania</div>';
    else if (fees.fastestFee < 2 && btc > 50000) ah += '<div class="alert good">✅ Low fees at high BTC price — network not congested</div>';
    else ah += '<div class="alert good">✅ All systems nominal — fees normal for current conditions</div>';
    document.getElementById('alerts').innerHTML = ah;

    var ts = d.timestamp ? new Date(d.timestamp).toLocaleString() : '—';
    document.getElementById('timestamp').textContent = 'Last updated: ' + ts + ' UTC · Data refreshes daily via GitHub Actions · ' + (mt !== '—' ? mt + ' unconfirmed tx in mempool' : '');
  })
  .catch(function(e) {
    document.getElementById('kpi-grid').innerHTML = '<div class="kpi-card" style="grid-column:span 4"><div class="label">Status</div><div class="value" style="color:#F85149;font-size:18px;">⚠ Could not load live data</div><div class="sub">Run python3 tools/research_monitor.py or wait for the next GitHub Action run.</div></div>';
  });
</script>
</body>
</html>
