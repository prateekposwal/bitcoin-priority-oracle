<!DOCTYPE html>
<html>
<head>
  <title>Bitcoin Sahi — Live Fee Visualization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1A1612; font-family: -apple-system, system-ui, sans-serif; }
    
    #viz-fees { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    
    .overlay { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; }
    .overlay h1 { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
    .overlay .cta { display: inline-block; padding: 14px 32px; background: #F7931A; color: #1A1612; font-size: 17px; font-weight: 700; border-radius: 100px; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; }
    .overlay .cta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,147,26,0.3); }
    
    @media (max-width: 600px) {
      .overlay { bottom: 24px; width: 90%; }
      .overlay .cta { display: block; }
    }
  </style>
</head>
<body>
  <canvas id="viz-fees"></canvas>
  <div style="position:fixed;bottom:48px;left:50%;transform:translateX(-50%);z-index:10;">
    <a href="/live" style="display:inline-block;padding:14px 32px;background:#F7931A;color:#1A1612;font-size:17px;font-weight:700;border-radius:100px;text-decoration:none;transition:transform 0.2s;" 
       onmouseover="this.style.transform='translateY(-2px)'" 
       onmouseout="this.style.transform=''">Should I send now?</a>
  </div>
  <script src="tools/data-engine.js"></script>
  <script src="tools/viz-core.js"></script>
  <script src="tools/viz-fees.js"></script>
  <script>
    DATA_ENGINE.start();
    VIZ_Fees.init('viz-fees');
  </script>
</body>
</html>
