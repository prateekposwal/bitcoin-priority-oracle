# Bitcoin Sahi — Bitcoin Core Configuration
# Place in ~/Library/Application Support/Bitcoin/bitcoin.conf

# Pruned mode (~5GB)
prune=5000

# Enable JSON-RPC
server=1
rest=1

# RPC credentials
rpcuser=bsahi
rpcpassword=bsahi

# Allow local connections only
rpcallowip=127.0.0.1

# Reduce bandwidth (solo research node)
maxconnections=8
blocksonly=1

# No indexing needed
txindex=0

# Run in background
daemon=1
